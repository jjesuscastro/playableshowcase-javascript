services:
  showcase:
    build: .
    ports:
      - "3003:3000"
    volumes:
      - /media/playableShowcase/uploads:/uploads
      - /media/playableShowcase/data:/data
    environment:
      - PORT=3000
      - UPLOADS_DIR=/uploads
      - DB_PATH=/data/apps.json
      - SHOWCASE_PASSWORD=${SHOWCASE_PASSWORD}
    restart: unless-stopped
