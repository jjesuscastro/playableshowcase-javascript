services:
  showcase:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - /media/playableShowcase/uploads:/uploads
      - /media/playableShowcase/data:/data
    environment:
      - PORT=3000
      - UPLOADS_DIR=/uploads
      - DB_PATH=/data/apps.json
    env_file:
      - .env
    restart: unless-stopped
